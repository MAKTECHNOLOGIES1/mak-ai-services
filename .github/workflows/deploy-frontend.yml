name: Cloudflare Frontend UI Deployment Pipeline

on:
  push:
    branches:
      - testing-1
  workflow_dispatch:
    inputs:
      target_env:
        description: '1. Select Target Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      version_tag:
        description: '2. Version Tag (Leave blank to use frontend/package.json version)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  R2_BUCKET_NAME: "mak-ui-builds"

jobs:
  # =========================================================================
  # STAGE 0: RESOLVE TARGETS & VALIDATE SECRETS
  # =========================================================================
  resolve-and-check:
    name: 0. Resolve Targets & Validate Secrets
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.inspect.outputs.target_env }}
      version: ${{ steps.inspect.outputs.version }}
      r2_key: ${{ steps.inspect.outputs.r2_key }}
      should_deploy: ${{ steps.inspect.outputs.should_deploy }}
    steps:
      - name: Verify Required Cloudflare Credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is missing! Please configure it in your GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "${{ env.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing! Please configure CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets or Variables."
            exit 1
          fi
          echo "✅ Cloudflare credentials verified."

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Inspect Frontend Version
        id: inspect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET_ENV="test"
            INPUT_VER=""
            echo "⚡ Push detected on branch '${{ github.ref_name }}' -> Targeting 'test' environment."

            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            echo "Changed files in this commit:"
            echo "$CHANGED_FILES"

            HAS_FRONTEND=$(echo "$CHANGED_FILES" | grep -E '^(frontend|\.github/workflows/deploy-frontend)' || true)
            if [ -n "$HAS_FRONTEND" ]; then
              echo "Frontend files modified -> proceeding to deploy."
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "No frontend files were modified in this push."
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            TARGET_ENV="${{ github.event.inputs.target_env }}"
            INPUT_VER="${{ github.event.inputs.version_tag }}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

          INPUT_VER=$(echo "$INPUT_VER" | xargs | tr '[:upper:]' '[:lower:]')

          PKG_VER=$(jq -r '.version // "1.0.0"' frontend/package.json)
          if [[ ! "$PKG_VER" =~ ^v ]]; then
            PKG_VER="v$PKG_VER"
          fi

          if [ -n "$INPUT_VER" ]; then
            RESOLVED_VER="$INPUT_VER"
          else
            RESOLVED_VER="$PKG_VER"
          fi

          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "version=$RESOLVED_VER" >> $GITHUB_OUTPUT
          echo "r2_key=builds/mak-ui-${RESOLVED_VER}.tar.gz" >> $GITHUB_OUTPUT

  # =========================================================================
  # STAGE 1: CODE QUALITY VALIDATION
  # =========================================================================
  validate:
    name: 1. Code Quality & Lint Check
    needs: resolve-and-check
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Frontend Code
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run lint || echo "::warning::Linter found recommendations in frontend code."

  # =========================================================================
  # STAGE 2: BUILD & ARCHIVE TO R2 (OPTIONAL / NON-BLOCKING)
  # =========================================================================
  build-and-archive:
    name: 2. Build Assets & Archive
    needs: [resolve-and-check, validate]
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Package Dist Bundle
        run: |
          mkdir -p /tmp/ui_build
          tar -czf /tmp/ui_build/dist.tar.gz -C frontend/dist .

      - name: Archive to Cloudflare R2
        continue-on-error: true
        run: |
          npx wrangler r2 object put "${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }}" --file=/tmp/ui_build/dist.tar.gz --remote || echo "Notice: R2 upload skipped. Continuing direct deployment."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  # =========================================================================
  # STAGE 3: DEPLOY TO CLOUDFLARE WORKERS ASSETS
  # =========================================================================
  deploy:
    name: 3. Deploy to Cloudflare (${{ needs.resolve-and-check.outputs.target_env }})
    needs: [resolve-and-check, validate, build-and-archive]
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployed_url: ${{ steps.deploy_ui.outputs.deployed_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Assets
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy Frontend to Cloudflare Workers
        id: deploy_ui
        working-directory: frontend
        run: |
          TARGET_ENV="${{ needs.resolve-and-check.outputs.target_env }}"
          echo "🚀 Deploying Frontend UI via Wrangler to env: $TARGET_ENV"
          npx wrangler deploy --env "$TARGET_ENV" 2>&1 | tee /tmp/ui_deploy.log

          EXTRACTED_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/ui_deploy.log | tail -n 1 || true)
          if [ -n "$EXTRACTED_URL" ]; then
            echo "deployed_url=$EXTRACTED_URL" >> $GITHUB_OUTPUT
            echo "DEPLOYED_URL=$EXTRACTED_URL" >> $GITHUB_ENV
            echo "✅ Frontend successfully deployed to: $EXTRACTED_URL"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke Test Endpoint
        run: |
          if [ -n "$DEPLOYED_URL" ]; then
            echo "Pinging Frontend UI endpoint: $DEPLOYED_URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYED_URL" || echo "000")
            echo "Smoke test HTTP Status: $HTTP_CODE"
          fi

  # =========================================================================
  # STAGE 4: PIPELINE SUMMARY
  # =========================================================================
  pipeline-report:
    name: 4. Deployment Summary
    needs: [resolve-and-check, validate, build-and-archive, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Execution Report
        run: |
          SHOULD_DEPLOY="${{ needs.resolve-and-check.outputs.should_deploy }}"
          TARGET_ENV="${{ needs.resolve-and-check.outputs.target_env }}"
          VERSION="${{ needs.resolve-and-check.outputs.version }}"
          URL="${{ needs.deploy.outputs.deployed_url }}"

          echo "## ⚡ Cloudflare Frontend UI Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`$TARGET_ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Branch**: \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY

          if [ "$SHOULD_DEPLOY" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Skipped**: No frontend files were changed in this commit." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ -n "$URL" ]; then
            echo "- **Live URL**: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 0. Secret Validation | ${{ needs.resolve-and-check.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Lint Check | ${{ needs.validate.result == 'success' && '✅ Passed' || '⚠️ Completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Build & Archive | ${{ needs.build-and-archive.result == 'success' && '✅ Stored/Ready' || 'ℹ️ Direct Fallback' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Cloudflare Deployment | ${{ needs.deploy.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
