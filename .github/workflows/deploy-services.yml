name: Cloudflare Services Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: '1. Select Microservice to Deploy'
        required: true
        default: 'identity_service'
        type: choice
        options:
          - identity_service
          - tenant_service
          - academic_service
          - ai_agent_service
          - ai_chat_service
          - ai_evaluation_service
          - ai_gateway_service
          - analytics_service
          - api_gateway
          - assessment_service
          - audit_service
          - billing_service
          - career_service
          - certification_service
          - enrollment_service
          - faculty_ai_service
          - hackathon_service
          - integration_service
          - internship_service
          - knowledge_rag_service
          - learning_service
          - mentorship_service
          - notification_service
          - placement_service
          - project_studio_service
      target_env:
        description: '2. Select Target Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      version_tag:
        description: '3. Explicit Version Tag (e.g. v1.0.0; Leave blank to use version.json)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.service_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET_NAME: "mak-services-builds"
  CLOUDFLARE_ACCOUNT_ID: "a8783999a53c63b47959dbf8b88fca11"

jobs:
  # =========================================================================
  # STAGE 0: RESOLVE VERSION & VERIFY R2 STATUS
  # =========================================================================
  resolve-and-check:
    name: 0. Resolve Version & Inspect R2
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.inspect.outputs.service_name }}
      cf_worker_name: ${{ steps.inspect.outputs.cf_worker_name }}
      target_env: ${{ steps.inspect.outputs.target_env }}
      version: ${{ steps.inspect.outputs.version }}
      r2_key: ${{ steps.inspect.outputs.r2_key }}
      action: ${{ steps.inspect.outputs.action }}
      overwrite: ${{ steps.inspect.outputs.overwrite }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Version and Cloudflare R2
        id: inspect
        run: |
          SERVICE_NAME="${{ github.event.inputs.service_name }}"
          CF_WORKER_NAME=$(echo "mak-${SERVICE_NAME}" | tr '_' '-')
          TARGET_ENV="${{ github.event.inputs.target_env }}"
          INPUT_VER="${{ github.event.inputs.version_tag }}"
          INPUT_VER=$(echo "$INPUT_VER" | xargs | tr '[:upper:]' '[:lower:]')

          # 1. Read base version from version.json
          if [ -f "version.json" ]; then
            PKG_VER=$(jq -r --arg s "$SERVICE_NAME" '.services[$s] // .version' version.json)
          else
            PKG_VER="1.0.0"
          fi

          if [[ ! "$PKG_VER" =~ ^v ]]; then
            PKG_VER="v$PKG_VER"
          fi

          # 2. Determine target explicit version string (No 'latest' concept)
          if [ -n "$INPUT_VER" ]; then
            RESOLVED_VER="$INPUT_VER"
            IS_BLANK=false
            echo "Notice: Using specified version tag: $RESOLVED_VER"
          else
            RESOLVED_VER="$PKG_VER"
            IS_BLANK=true
            echo "Notice: Version left blank. Using explicit version from version.json: $RESOLVED_VER"
          fi

          # 3. Determine Cloudflare R2 Object Key (Strictly version-tagged)
          if [[ "$RESOLVED_VER" == *.tar.gz ]]; then
            R2_KEY="builds/$RESOLVED_VER"
          else
            R2_KEY="builds/${SERVICE_NAME}-${RESOLVED_VER}.tar.gz"
          fi

          # 4. Check if exact version package exists in Cloudflare R2
          echo "Inspecting R2 bucket for: $R2_KEY..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ env.CLOUDFLARE_ACCOUNT_ID }}/r2/buckets/${{ env.R2_BUCKET_NAME }}/objects/${R2_KEY}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" || echo "000")

          echo "Cloudflare R2 inspection status code: $HTTP_STATUS"

          # 5. Route the deployment action
          if [ "$TARGET_ENV" = "test" ]; then
            if [ "$IS_BLANK" = "true" ]; then
              ACTION="build_and_deploy_test"
              if [ "$HTTP_STATUS" = "200" ]; then
                OVERWRITE="true"
                echo "⚠️ Notice: Version $RESOLVED_VER already exists in R2. Rebuilding and overwriting."
              else
                OVERWRITE="false"
                echo "Notice: New version $RESOLVED_VER will be created in R2."
              fi
            else
              if [ "$HTTP_STATUS" = "200" ]; then
                ACTION="deploy_existing_test"
                OVERWRITE="false"
                echo "✅ Existing build found in R2 for $RESOLVED_VER. Deploying pre-built package directly to Test."
              else
                ACTION="build_and_deploy_test"
                OVERWRITE="false"
                echo "Notice: Version $RESOLVED_VER not in R2. Building fresh and saving to R2."
              fi
            fi
          else
            # TARGET_ENV == prod (MANDATORY: Explicit version MUST already exist in R2)
            if [ "$HTTP_STATUS" = "200" ]; then
              ACTION="deploy_prod"
              OVERWRITE="false"
              echo "✅ Verified: $R2_KEY exists in R2. Safe to promote to Production."
            else
              ACTION="fail_prod"
              OVERWRITE="false"
              echo "::error::❌ DEPLOYMENT BLOCKED: Version '$RESOLVED_VER' ($R2_KEY) was NOT found in Cloudflare R2!"
              echo "Production deployments must strictly be promoted from existing, tested R2 builds."
              echo "Please build and test version '$RESOLVED_VER' in Test first before promoting to Production."
              exit 1
            fi
          fi

          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "cf_worker_name=$CF_WORKER_NAME" >> $GITHUB_OUTPUT
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "version=$RESOLVED_VER" >> $GITHUB_OUTPUT
          echo "r2_key=$R2_KEY" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "overwrite=$OVERWRITE" >> $GITHUB_OUTPUT

  # =========================================================================
  # STAGE 1: CODE VALIDATION
  # Only runs when building fresh code for Test
  # =========================================================================
  validate:
    name: 1. Code Quality & Security Scan
    needs: resolve-and-check
    if: needs.resolve-and-check.outputs.action == 'build_and_deploy_test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'services/${{ needs.resolve-and-check.outputs.service_name }}/requirements.txt'

      - name: Install Linting & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Install Service Dependencies
        run: |
          pip install -r services/${{ needs.resolve-and-check.outputs.service_name }}/requirements.txt

      - name: Code Quality & Lint Check (Ruff)
        run: |
          ruff check services/${{ needs.resolve-and-check.outputs.service_name }} --ignore E501

      - name: Syntax & Import Verification
        run: |
          python -m py_compile services/${{ needs.resolve-and-check.outputs.service_name }}/main.py
          echo "✅ Syntax verification passed for ${{ needs.resolve-and-check.outputs.service_name }}"

  # =========================================================================
  # STAGE 2: PACKAGE VERSIONED ARTIFACT & STORE IN R2
  # Only runs when building fresh code for Test
  # =========================================================================
  build-and-upload-r2:
    name: 2. Package Artifact & Save to R2
    needs: [resolve-and-check, validate]
    if: needs.resolve-and-check.outputs.action == 'build_and_deploy_test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Package Service Directory
        run: |
          SERVICE="${{ needs.resolve-and-check.outputs.service_name }}"
          mkdir -p build_output
          cp -r services/$SERVICE/* build_output/
          
          # Create compressed archive
          tar -czf package.tar.gz -C build_output .
          echo "Created package.tar.gz: $(du -sh package.tar.gz | cut -f1)"

      - name: Save Version in Cloudflare R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }} --file=package.tar.gz --remote

      - name: Record Storage Metadata
        run: |
          echo "### 📦 Cloudflare R2 Build Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ needs.resolve-and-check.outputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag**: \`${{ needs.resolve-and-check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 File**: \`${{ needs.resolve-and-check.outputs.r2_key }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Rebuild Overwrite**: ${{ needs.resolve-and-check.outputs.overwrite == 'true' && '⚠️ Overwrote existing version' || 'New build created' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 3: TEST ENVIRONMENT DEPLOYMENT
  # Deploys fresh or existing R2 build to Cloudflare Test Worker
  # =========================================================================
  deploy-test:
    name: 3. Deploy to Test Environment
    needs: [resolve-and-check, build-and-upload-r2]
    if: |
      always() &&
      needs.resolve-and-check.outputs.target_env == 'test' &&
      (
        needs.build-and-upload-r2.result == 'success' ||
        needs.resolve-and-check.outputs.action == 'deploy_existing_test'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Package from Cloudflare R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get ${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }} --file=package.tar.gz --remote

      - name: Extract Build Package
        run: |
          SERVICE="${{ needs.resolve-and-check.outputs.service_name }}"
          mkdir -p deploy_dir
          tar -xzf package.tar.gz -C deploy_dir
          
          # Copy wrangler config if present
          if [ -f "services/$SERVICE/wrangler.jsonc" ]; then
            cp "services/$SERVICE/wrangler.jsonc" deploy_dir/
          elif [ -f "services/$SERVICE/wrangler.json" ]; then
            cp "services/$SERVICE/wrangler.json" deploy_dir/
          fi
          
          echo "Extracted service deployment contents:"
          ls -la deploy_dir/

      - name: Deploy to Cloudflare (Test Environment)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy_dir
          command: deploy --env test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Smoke Test Health Endpoint
        run: |
          CF_NAME="${{ needs.resolve-and-check.outputs.cf_worker_name }}"
          TEST_URL="https://${CF_NAME}-test.anilkumarreddy3029.workers.dev/health"
          echo "Pinging Test Health Endpoint: $TEST_URL..."
          curl -s -o /dev/null -w "%{http_code}" "$TEST_URL" || true

      - name: Test Deployment Summary
        run: |
          CF_NAME="${{ needs.resolve-and-check.outputs.cf_worker_name }}"
          echo "### 🧪 Test Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ needs.resolve-and-check.outputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Version**: \`${{ needs.resolve-and-check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: \`${CF_NAME}-test\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [https://${CF_NAME}-test.anilkumarreddy3029.workers.dev](https://${CF_NAME}-test.anilkumarreddy3029.workers.dev)" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 4: PRODUCTION DEPLOYMENT
  # ALWAYS deploys strictly from verified Cloudflare R2 version
  # =========================================================================
  deploy-prod:
    name: 4. Deploy to Production (Strictly from R2 Version)
    needs: [resolve-and-check]
    if: needs.resolve-and-check.outputs.target_env == 'prod' && needs.resolve-and-check.outputs.action == 'deploy_prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Verified Package from Cloudflare R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get ${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }} --file=package.tar.gz --remote

      - name: Extract Verified Package
        run: |
          SERVICE="${{ needs.resolve-and-check.outputs.service_name }}"
          mkdir -p deploy_dir
          tar -xzf package.tar.gz -C deploy_dir
          
          # Copy wrangler config if present
          if [ -f "services/$SERVICE/wrangler.jsonc" ]; then
            cp "services/$SERVICE/wrangler.jsonc" deploy_dir/
          elif [ -f "services/$SERVICE/wrangler.json" ]; then
            cp "services/$SERVICE/wrangler.json" deploy_dir/
          fi
          
          echo "Extracted verified production assets:"
          ls -la deploy_dir/

      - name: Deploy to Cloudflare (Production Environment)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy_dir
          command: deploy --env prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD || secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Smoke Test Endpoint
        run: |
          CF_NAME="${{ needs.resolve-and-check.outputs.cf_worker_name }}"
          PROD_URL="https://${CF_NAME}.anilkumarreddy3029.workers.dev/health"
          echo "Pinging Production Endpoint: $PROD_URL..."
          curl -s -o /dev/null -w "%{http_code}" "$PROD_URL" || true

      - name: Production Deployment Summary
        run: |
          CF_NAME="${{ needs.resolve-and-check.outputs.cf_worker_name }}"
          echo "### 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ needs.resolve-and-check.outputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Version**: \`${{ needs.resolve-and-check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: \`${CF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Verified Source**: Cloudflare R2 (\`${{ needs.resolve-and-check.outputs.r2_key }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [https://${CF_NAME}.anilkumarreddy3029.workers.dev](https://${CF_NAME}.anilkumarreddy3029.workers.dev)" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 5: AUDIT SUMMARY REPORT
  # =========================================================================
  pipeline-report:
    name: 5. Pipeline Audit Report
    needs: [resolve-and-check, validate, build-and-upload-r2, deploy-test, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Execution Report
        run: |
          SERVICE="${{ needs.resolve-and-check.outputs.service_name }}"
          CF_NAME="${{ needs.resolve-and-check.outputs.cf_worker_name }}"
          echo "## 📊 Cloudflare Microservices Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`$SERVICE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker Name**: \`$CF_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag**: \`${{ needs.resolve-and-check.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${{ needs.resolve-and-check.outputs.target_env }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 Bucket**: \`${{ env.R2_BUCKET_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Action Taken**: \`${{ needs.resolve-and-check.outputs.action }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 0. Resolve & Check | ${{ needs.resolve-and-check.result == 'success' && '✅ Completed' || '❌ Failed' }} | Target: \`${{ needs.resolve-and-check.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Code Validation | ${{ needs.validate.result == 'success' && '✅ Passed' || (needs.validate.result == 'skipped' && '⏭️ Skipped (R2 Pull)' || '❌ Failed') }} | Ruff & syntax verification |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Package & R2 Upload | ${{ needs.build-and-upload-r2.result == 'success' && '✅ Stored in R2' || (needs.build-and-upload-r2.result == 'skipped' && '⏭️ Skipped (R2 Pull)' || '❌ Failed') }} | ${{ needs.resolve-and-check.outputs.overwrite == 'true' && 'Overwrote existing build' || 'Package stored' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Deploy Test | ${{ needs.deploy-test.result == 'success' && '✅ Deployed' || (needs.deploy-test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | [${CF_NAME}-test](https://${CF_NAME}-test.anilkumarreddy3029.workers.dev) |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. Deploy Prod | ${{ needs.deploy-prod.result == 'success' && '✅ Deployed (from R2)' || (needs.deploy-prod.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} | [${CF_NAME}](https://${CF_NAME}.anilkumarreddy3029.workers.dev) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: \`${{ github.actor }}\` (Manual Trigger)" >> $GITHUB_STEP_SUMMARY
