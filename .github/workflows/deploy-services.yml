name: Cloudflare Services Deployment Pipeline

on:
  push:
    branches:
      - testing-1
  workflow_dispatch:
    inputs:
      service_name:
        description: '1. Select Microservice to Deploy'
        required: true
        default: 'tenant_service'
        type: choice
        options:
          - tenant_service
          - identity_service
          - api_gateway
          - all_services
          - academic_service
          - ai_agent_service
          - ai_chat_service
          - ai_evaluation_service
          - ai_gateway_service
          - analytics_service
          - assessment_service
          - audit_service
          - billing_service
          - career_service
          - certification_service
          - enrollment_service
          - faculty_ai_service
          - hackathon_service
          - integration_service
          - internship_service
          - knowledge_rag_service
          - learning_service
          - mentorship_service
          - notification_service
          - placement_service
          - project_studio_service
      target_env:
        description: '2. Select Target Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
      version_tag:
        description: '3. Explicit Version Tag (e.g. v1.0.0; Leave blank to use version.json)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.service_name || 'push' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  R2_BUCKET_NAME: "mak-services-builds"

jobs:
  # =========================================================================
  # STAGE 0: RESOLVE VERSION & TARGETS
  # =========================================================================
  resolve-and-check:
    name: 0. Resolve Targets & Validate Secrets
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.inspect.outputs.service_name }}
      services_list: ${{ steps.inspect.outputs.services_list }}
      target_env: ${{ steps.inspect.outputs.target_env }}
      version: ${{ steps.inspect.outputs.version }}
      r2_key: ${{ steps.inspect.outputs.r2_key }}
      action: ${{ steps.inspect.outputs.action }}
      should_deploy: ${{ steps.inspect.outputs.should_deploy }}
    steps:
      - name: Verify Required Cloudflare Credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is missing! Please configure it in your GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "${{ env.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing! Please configure CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets or Variables."
            exit 1
          fi
          echo "✅ Cloudflare credentials verified."

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Inspect Version and Services
        id: inspect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET_ENV="test"
            INPUT_VER=""
            echo "⚡ Push detected on branch '${{ github.ref_name }}' -> Targeting 'test' environment."

            # Detect modified backend services from commit diff
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            echo "Changed files in this commit:"
            echo "$CHANGED_FILES"

            MODIFIED_SERVICES=$(echo "$CHANGED_FILES" | grep '^backend_services/' | cut -d'/' -f2 | sort -u | grep -v '^$' || true)

            if [ -n "$MODIFIED_SERVICES" ]; then
              echo "Modified backend service(s) detected: $MODIFIED_SERVICES"
              SERVICES=$(echo "$MODIFIED_SERVICES" | jq -R -s -c 'split("\n")[:-1]')
              SERVICE_NAME=$(echo "$MODIFIED_SERVICES" | head -n 1)
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              HAS_BACKEND_CONF=$(echo "$CHANGED_FILES" | grep -E '^(backend_services|\.github/workflows/deploy-services|\.github/scripts/convert_requirements|version\.json)' || true)
              if [ -n "$HAS_BACKEND_CONF" ]; then
                echo "Backend-related workflow or config updated. Deploying tenant_service..."
                SERVICES='["tenant_service"]'
                SERVICE_NAME="tenant_service"
                echo "should_deploy=true" >> $GITHUB_OUTPUT
              else
                echo "No backend services were modified in this push."
                SERVICES="[]"
                SERVICE_NAME="none"
                echo "should_deploy=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            TARGET_ENV="${{ github.event.inputs.target_env }}"
            INPUT_VER="${{ github.event.inputs.version_tag }}"
            SERVICE_NAME="${{ github.event.inputs.service_name }}"

            if [ "$SERVICE_NAME" = "all_services" ]; then
              SERVICES=$(ls -d backend_services/*/ | sed 's|backend_services/||' | sed 's|/||' | jq -R -s -c 'split("\n")[:-1]')
            else
              SERVICES=$(echo "[\"$SERVICE_NAME\"]")
            fi
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

          INPUT_VER=$(echo "$INPUT_VER" | xargs | tr '[:upper:]' '[:lower:]')

          echo "services_list=$SERVICES" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

          # Resolve version tag from version.json or package
          if [ -f "version.json" ]; then
            PKG_VER=$(jq -r --arg s "$SERVICE_NAME" '.services[$s] // .version // "1.0.0"' version.json)
          else
            PKG_VER="1.0.0"
          fi

          if [[ ! "$PKG_VER" =~ ^v ]]; then
            PKG_VER="v$PKG_VER"
          fi

          if [ -n "$INPUT_VER" ]; then
            RESOLVED_VER="$INPUT_VER"
          else
            RESOLVED_VER="$PKG_VER"
          fi
          echo "version=$RESOLVED_VER" >> $GITHUB_OUTPUT

          R2_KEY="builds/${SERVICE_NAME}-${RESOLVED_VER}.tar.gz"
          echo "r2_key=$R2_KEY" >> $GITHUB_OUTPUT

          # Check Cloudflare R2 bucket connectivity (graceful fallback)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ env.CLOUDFLARE_ACCOUNT_ID }}/r2/buckets/${{ env.R2_BUCKET_NAME }}/objects/${R2_KEY}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" || echo "000")

          echo "R2 probe status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] && [ "$TARGET_ENV" = "prod" ]; then
            echo "action=pull_from_r2" >> $GITHUB_OUTPUT
          else
            echo "action=build_and_deploy" >> $GITHUB_OUTPUT
          fi

  # =========================================================================
  # STAGE 1: CODE QUALITY VALIDATION
  # =========================================================================
  validate:
    name: 1. Code Quality & Syntax Check
    needs: resolve-and-check
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Lint Backend Services
        run: |
          SERVICE_NAME="${{ needs.resolve-and-check.outputs.service_name }}"
          if [ "$SERVICE_NAME" = "all_services" ]; then
            echo "Linting all backend services..."
            ruff check backend_services/ || echo "::warning::Ruff found stylistic recommendations in backend services."
          else
            echo "Linting service: backend_services/$SERVICE_NAME"
            ruff check "backend_services/$SERVICE_NAME" || echo "::warning::Ruff found stylistic recommendations in $SERVICE_NAME."
          fi

  # =========================================================================
  # STAGE 2: BUILD & ARCHIVE TO R2 (OPTIONAL / NON-BLOCKING)
  # =========================================================================
  build-and-archive:
    name: 2. Package & Archive Artifact
    needs: [resolve-and-check, validate]
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create Package Archive
        run: |
          SERVICE_NAME="${{ needs.resolve-and-check.outputs.service_name }}"
          VERSION="${{ needs.resolve-and-check.outputs.version }}"
          mkdir -p /tmp/pkg_build

          if [ "$SERVICE_NAME" = "all_services" ]; then
            tar -czf /tmp/pkg_build/package.tar.gz -C backend_services .
          else
            tar -czf /tmp/pkg_build/package.tar.gz -C "backend_services/$SERVICE_NAME" .
          fi
          echo "Package created at /tmp/pkg_build/package.tar.gz"

      - name: Upload Build Package to Cloudflare R2
        continue-on-error: true
        run: |
          echo "Uploading package to Cloudflare R2: ${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }}"
          npx wrangler r2 object put "${{ env.R2_BUCKET_NAME }}/${{ needs.resolve-and-check.outputs.r2_key }}" --file=/tmp/pkg_build/package.tar.gz --remote || echo "Notice: R2 storage upload skipped. Continuing direct deployment."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  # =========================================================================
  # STAGE 3: DEPLOY TO CLOUDFLARE WORKERS
  # =========================================================================
  deploy:
    name: 3. Deploy to Cloudflare (${{ needs.resolve-and-check.outputs.target_env }})
    needs: [resolve-and-check, validate, build-and-archive]
    if: needs.resolve-and-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployed_url: ${{ steps.deploy_worker.outputs.deployed_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Astral UV & Python Workers SDK
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler Globally
        run: npm install -g wrangler@latest

      - name: Deploy Service(s) to Cloudflare Workers
        id: deploy_worker
        run: |
          TARGET_ENV="${{ needs.resolve-and-check.outputs.target_env }}"
          SERVICES_JSON='${{ needs.resolve-and-check.outputs.services_list }}'

          deploy_single_service() {
            local SVC_PATH="$1"
            local SVC_NAME=$(basename "$SVC_PATH")
            echo "================================================================="
            echo "🚀 Deploying service: $SVC_NAME to environment: $TARGET_ENV"
            echo "================================================================="

            cd "$GITHUB_WORKSPACE/$SVC_PATH"

            # Ensure build venvs are excluded from Wrangler's module upload
            touch .gitignore
            grep -qxF ".venv-workers/" .gitignore || echo ".venv-workers/" >> .gitignore
            grep -qxF ".venv*/" .gitignore || echo ".venv*/" >> .gitignore

            # Auto-convert requirements.txt to pyproject.toml if missing
            python "$GITHUB_WORKSPACE/.github/scripts/convert_requirements.py" .

            # Deploy using pywrangler sync + wrangler deploy
            DEPLOY_LOG="/tmp/deploy_${SVC_NAME}.log"
            if [ -f "pyproject.toml" ]; then
              echo "Syncing Python Worker packages into python_modules via pywrangler..."
              uvx --from workers-py pywrangler sync
              echo "Removing temporary build venv to prevent bundle bloat..."
              rm -rf .venv-workers .venv
              echo "Deploying Python Worker via Wrangler..."
              set -o pipefail
              npx wrangler deploy --env "$TARGET_ENV" 2>&1 | tee "$DEPLOY_LOG"
              set +o pipefail
            else
              echo "Deploying standard Worker via wrangler..."
              set -o pipefail
              npx wrangler deploy --env "$TARGET_ENV" 2>&1 | tee "$DEPLOY_LOG"
              set +o pipefail
            fi

            # Extract deployed workers.dev URL if present
            EXTRACTED_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)
            if [ -n "$EXTRACTED_URL" ]; then
              echo "DEPLOYED_URL=$EXTRACTED_URL" >> $GITHUB_ENV
              echo "deployed_url=$EXTRACTED_URL" >> $GITHUB_OUTPUT
              echo "✅ Service $SVC_NAME successfully deployed at: $EXTRACTED_URL"
            fi
            cd "$GITHUB_WORKSPACE"
          }

          if [ "$SERVICES_JSON" = "[]" ] || [ -z "$SERVICES_JSON" ]; then
            echo "No services targeted for deployment."
          else
            echo "$SERVICES_JSON" | jq -r '.[]' | while read -r SVC; do
              if [ -n "$SVC" ] && [ -d "backend_services/$SVC" ]; then
                deploy_single_service "backend_services/$SVC"
              fi
            done
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_TEST || secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Smoke Test Endpoint
        run: |
          if [ -n "$DEPLOYED_URL" ]; then
            echo "Pinging deployed endpoint: $DEPLOYED_URL/health"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYED_URL/health" || curl -s -o /dev/null -w "%{http_code}" "$DEPLOYED_URL" || echo "000")
            echo "Smoke test HTTP Status: $HTTP_CODE"
          else
            echo "Deployment completed without worker URL parse."
          fi

  # =========================================================================
  # STAGE 4: PIPELINE AUDIT REPORT
  # =========================================================================
  pipeline-report:
    name: 4. Deployment Summary
    needs: [resolve-and-check, validate, build-and-archive, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Execution Report
        run: |
          SHOULD_DEPLOY="${{ needs.resolve-and-check.outputs.should_deploy }}"
          SERVICE="${{ needs.resolve-and-check.outputs.service_name }}"
          TARGET_ENV="${{ needs.resolve-and-check.outputs.target_env }}"
          VERSION="${{ needs.resolve-and-check.outputs.version }}"
          URL="${{ needs.deploy.outputs.deployed_url }}"

          echo "## ⚡ Cloudflare Services Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`$TARGET_ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Service(s)**: \`$SERVICE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Branch**: \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY

          if [ "$SHOULD_DEPLOY" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Skipped**: No backend services were changed in this commit." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ -n "$URL" ]; then
            echo "- **Live URL**: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 0. Target & Secret Validation | ${{ needs.resolve-and-check.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Lint & Syntax Check | ${{ needs.validate.result == 'success' && '✅ Passed' || '⚠️ Completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Build & Archive | ${{ needs.build-and-archive.result == 'success' && '✅ Stored/Ready' || 'ℹ️ Direct Fallback' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Cloudflare Deployment | ${{ needs.deploy.result == 'success' && '✅ Deployed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
