[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mak-identity-service"
version = "1.0.0"
description = "AMK Multi-Tenant Identity Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose>=3.3.0",
    "email-validator>=2.1.0"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]

[tool.setuptools]
packages = ["core", "models", "routes", "schemas", "services"]
py-modules = ["main"]
