version: '3.8'

services:
  # 1. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amk_postgres_pgvector
    environment:
      POSTGRES_DB: amk_college_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for API Gateway Rate Limiting & Semantic Caching
  redis:
    image: redis:7-alpine
    container_name: amk_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Optional Local S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: amk_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

